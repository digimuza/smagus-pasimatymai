name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint (check only)
        run: pnpm lint:check

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  build-and-test:
    name: Build & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: santykiuklausimai
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://payload:payload@localhost:5433/santykiuklausimai
      PAYLOAD_SECRET: ci-test-secret-at-least-32-characters-long
      NEXT_PUBLIC_URL: http://localhost:7743
      STRIPE_SECRET_KEY: sk_test_fake_key_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_fake_for_ci
      STRIPE_MONTHLY_PRICE_ID: price_fake_monthly
      STRIPE_YEARLY_PRICE_ID: price_fake_yearly
      PLAYWRIGHT_BASE_URL: http://localhost:7743

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build

      - name: Seed database
        run: pnpm seed

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start server and run E2E tests
        run: |
          pnpm start &
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:7743/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:7743/api/health > /dev/null
          pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-image:
    name: Build, smoke test & publish image
    needs: [lint-and-typecheck, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: santykiuklausimai
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install seed dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed smoke database
        env:
          DATABASE_URL: postgresql://payload:payload@localhost:5433/santykiuklausimai
          PAYLOAD_SECRET: ci-test-secret-at-least-32-characters-long
          NEXT_PUBLIC_URL: http://localhost:7743
        run: pnpm seed

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: santykiu-klausimai:ci
          build-args: |
            NEXT_PUBLIC_URL=https://pasimatymai.digimuza.ai
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name app-smoke --add-host=host.docker.internal:host-gateway \
            -p 7743:7743 \
            -e DATABASE_URL=postgresql://payload:payload@host.docker.internal:5433/santykiuklausimai \
            -e PAYLOAD_SECRET=ci-test-secret-at-least-32-characters-long \
            -e NEXT_PUBLIC_URL=http://localhost:7743 \
            santykiu-klausimai:ci
          trap 'docker logs app-smoke; docker rm -f app-smoke' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:7743/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:7743/api/health
          curl --fail --silent --output /dev/null http://localhost:7743/en

      - name: Image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.digimuza.ai/pasimatymai
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Log in to Digimuza registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: docker.digimuza.ai
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Publish tested image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_URL=https://pasimatymai.digimuza.ai
          cache-from: type=gha

      - name: Deploy in Coolify
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -X POST https://coolify.digimuza.ai/api/v1/deploy \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"uuid":"xmz4o79mozm02bj7ntmee7fv"}')
          deployment_uuid=$(jq -r '.deployments[0].deployment_uuid // empty' <<< "$response")
          test -n "$deployment_uuid"
          echo "Coolify deployment: $deployment_uuid"
          status=pending
          for attempt in {1..90}; do
            status=$(curl --fail-with-body --silent --show-error \
              "https://coolify.digimuza.ai/api/v1/deployments/$deployment_uuid" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" | jq -r '.status')
            case "$status" in
              finished) break ;;
              failed|cancelled|cancelled-by-user) echo "Coolify deployment $status"; exit 1 ;;
            esac
            sleep 5
          done
          test "$status" = finished
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            https://pasimatymai.digimuza.ai/api/health -o /dev/null
