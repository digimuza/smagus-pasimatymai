name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Trigger Coolify Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Coolify redeploy
        run: |
          curl --fail -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}"
